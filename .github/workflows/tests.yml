name: Build and test distributions

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  release-check:
    strategy:
      fail-fast: false
      matrix:
        # Python 3.9 builds are available on Ubuntu 24.04, not 26.04.
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ["3.9", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install release tools
        run: python -m pip install --upgrade pip build twine
      - name: Verify fresh wheel and sdist installations
        run: python tools/verify_release.py
      - name: Retain reports and distributions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-check-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            dist/release-checks/run-*/report.json
            dist/release-checks/run-*/*.log
            dist/release-checks/run-*/artifacts/*
